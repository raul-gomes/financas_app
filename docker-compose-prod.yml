# Production stack. All credentials come from .env (never versioned).
# Usage: docker compose -f docker-compose-prod.yml up -d --build
services:
  db:
    image: postgres:16-alpine
    container_name: financas-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./app/backend
    container_name: financas-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL:?set in .env}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:?set in .env}
      ENVIRONMENT: production
      PLUGGY_KEY_ENCRYPTION_KEYS: ${PLUGGY_KEY_ENCRYPTION_KEYS:?set in .env (see .env.example)}
      CORS_ORIGINS: ${CORS_ORIGINS:?set in .env}
    # Single-replica assumption: migrations run at start (see docs/comandos.md)
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    volumes:
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
        VITE_SUPABASE_URL: ${SUPABASE_URL:?set in .env}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:?set in .env}
    container_name: financas-web
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: financas-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set in .env}
    volumes:
      - ./infra/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./infra/snippets:/etc/nginx/snippets:ro
      - ./infra/certbot/www:/var/www/certbot:ro
      - ./infra/certbot/conf:/etc/letsencrypt:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
  backend-logs:
