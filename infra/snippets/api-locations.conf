# API locations shared by the dev and prod servers (zones are defined in each conf).

# API docs are never exposed through the proxy.
location ~* ^/api/(docs|redoc|openapi\.json)$ {
    return 403;
}

# Heavy endpoints: stricter rate limit, longer read timeout.
location = /api/extracts/upload {
    limit_req zone=api_heavy burst=3 nodelay;
    limit_req_status 429;
    proxy_read_timeout 120s;
    include /etc/nginx/snippets/proxy-api.conf;
}

location = /api/pluggy/sync {
    limit_req zone=api_heavy burst=3 nodelay;
    limit_req_status 429;
    proxy_read_timeout 120s;
    include /etc/nginx/snippets/proxy-api.conf;
}

location /api/ {
    limit_req zone=api_general burst=20 nodelay;
    limit_req_status 429;
    proxy_read_timeout 60s;
    include /etc/nginx/snippets/proxy-api.conf;
}
