# Development reverse proxy (Vite dev server on frontend:8080).
# Production uses infra/nginx.prod.conf.template.
upstream frontend_upstream {
    server frontend:8080;
}

upstream backend_upstream {
    server backend:8000;
}

limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=1r/s;

server {
    listen 80;
    server_name localhost;

    server_tokens off;
    client_max_body_size 10m;

    # Security headers (no CSP in dev: Vite HMR needs inline scripts and ws:)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # Liveness for the nginx container healthcheck
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Frontend (Vite dev server)
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s; # keeps the HMR websocket open
    }

    # Backend API: the only path to the backend
    include /etc/nginx/snippets/api-locations.conf;
}
