services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: financas-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-financas}
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: financas-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-financas}
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet || exit 1
      interval: 10s
      timeout: 10s
      retries: 5

  # Mongo Express (GUI for MongoDB)
  mongo-express:
    image: mongo-express:latest
    container_name: financas-mongo-express
    restart: always
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-password123}
    ports:
      - "8082:8081"
    depends_on:
      mongodb:
        condition: service_healthy

  # FastAPI Backend — dev mode with hot-reload
  # For production, see docker-compose.prod.yml
  backend:
    build: 
      context: ./backend
    container_name: financas-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-financas}
      MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-password123}@mongodb:27017/${MONGO_INITDB_DATABASE:-financas}?authSource=admin
      DATABASE_NAME: ${MONGO_INITDB_DATABASE:-financas}
    ports:
      - "8005:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy
      mongodb:
        condition: service_healthy

  # React Frontend — dev mode with hot-reload
  # For production, see docker-compose.prod.yml
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: financas-web
    restart: unless-stopped
    ports:
      - "8087:8080"
    volumes:
      # Mount entire frontend project for hot-reload
      - ./frontend:/app
      # Keep container's node_modules (don't override with host's)
      - /app/node_modules
      # Keep container's dist (not needed but avoid conflicts)
      - /app/dist
    depends_on:
      - backend

volumes:
  postgres-data:
  mongo-data:
