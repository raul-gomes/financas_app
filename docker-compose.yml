services:
  # PostgreSQL Database — NAO exposto externamente
  db:
    image: postgres:16-alpine
    container_name: financas-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-financas}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend — NAO exposto externamente, acessivel apenas via nginx
  backend:
    build: 
      context: ./app/backend
    container_name: financas-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-financas}
    volumes:
      - ./app/backend/app:/app/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy

  # React Frontend — NAO exposto externamente, acessivel apenas via nginx
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.dev
    container_name: financas-web
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      - backend

  # Nginx — UNICO ponto de acesso externo
  nginx:
    image: nginx:alpine
    container_name: financas-nginx
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
