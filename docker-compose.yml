services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: financas-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-financas}
    ports:
      - "5436:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend — dev mode with hot-reload
  # For production, see docker-compose.prod.yml
  backend:
    build: 
      context: ./backend
    container_name: financas-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-financas}
    ports:
      - "8005:8000"
    volumes:
      - ./backend/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  # React Frontend — dev mode with hot-reload
  # For production, see docker-compose.prod.yml
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: financas-web
    restart: unless-stopped
    ports:
      - "8087:8080"
    volumes:
      # Mount entire frontend project for hot-reload
      - ./frontend:/app
      # Keep container's node_modules (don't override with host's)
      - /app/node_modules
      # Keep container's dist (not needed but avoid conflicts)
      - /app/dist
    depends_on:
      - backend

volumes:
  postgres-data:
