services:
  # PostgreSQL Database — NAO exposto externamente
  db:
    image: postgres:16-alpine
    container_name: financas-db
    restart: always
    ports:
      # Loopback only: the DB must not be reachable from other hosts
      - "127.0.0.1:5436:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend — NAO exposto externamente, acessivel apenas via nginx
  backend:
    build: 
      context: ./app/backend
    container_name: financas-api
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      SUPABASE_AUTH_URL: ${SUPABASE_AUTH_URL:-http://host.docker.internal:64321}
      # Local Supabase signs tokens with its public address, not the one the API uses to reach it.
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-http://127.0.0.1:64321/auth/v1}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PLUGGY_KEY_ENCRYPTION_KEYS: ${PLUGGY_KEY_ENCRYPTION_KEYS:?set in .env (see .env.example)}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./app/backend/app:/app/app
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8000/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      db:
        condition: service_healthy

  # React Frontend — NAO exposto externamente, acessivel apenas via nginx
  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile.dev
    container_name: financas-web
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
      - /app/dist
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    depends_on:
      - backend

  # Nginx — UNICO ponto de acesso externo
  nginx:
    image: nginx:alpine
    container_name: financas-nginx
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infra/snippets:/etc/nginx/snippets:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - frontend
      - backend

volumes:
  postgres-data:
