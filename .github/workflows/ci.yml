name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (audit, typecheck, test, build, bundle budget)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Production tree must stay clean; dev tooling is tracked in docs/pendencias.md (Q12).
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=low

      # lint: enable after pendencias Q9
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle budget gate (per-chunk gzip <= 64kB)
        run: npm run check:bundle

  backend:
    name: Backend (ruff, pytest, postgres tests, alembic check, bandit, pip-audit)
    runs-on: ubuntu-latest
    # Throwaway Postgres for the migration check (CI-only credentials, never reused).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          enable-cache: true
          cache-dependency-glob: app/backend/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
        run: uv run pytest -q

      # Models and migrations must agree: apply every migration to an empty Postgres,
      # then fail if autogenerate still finds differences.
      - name: Migrations match models (alembic check)
        env:
          DATABASE_URL: "postgresql+asyncpg://ci:ci-throwaway@localhost:5432/ci"
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # PostgreSQL-only paths (advisory lock, savepoints, partial unique index, bulk insert).
      # The fixture drops and rebuilds the schema of the throwaway service database, then runs
      # `alembic upgrade head` itself.
      - name: Postgres integration tests
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          TEST_POSTGRES_URL: "postgresql+asyncpg://ci:ci-throwaway@localhost:5432/ci"
        run: uv run pytest -q -m postgres

      # SAST: blocks on medium+ severity. A `# nosec` needs a written reason on the same line.
      - name: SAST (bandit)
        run: uvx bandit==1.9.4 -r app -ll

      # Blocking: any known vulnerability in the locked dependencies fails the build.
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
