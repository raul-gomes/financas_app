[project]
name = "financas-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.162.7,<1",
    "httpx>=0.28.1,<1",
    "loguru>=0.8.0,<1",
    "python-dateutil>=4.0.0,<5",
    "python-dotenv>=1.2.4,<2",
    "sqlalchemy[asyncio]>=2.1.8,<3",
    "uvicorn>=0.54.0,<1",
    "asyncpg>=0.32.0,<1",
    "python-multipart>=0.0.33,<1",
    "pyjwt>=2.15.1,<3",
    "cryptography>=50.0.2,<51",
    "defusedxml>=0.7.1,<1",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1,<1",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.17.5",
    "time-machine>=3.6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC"]
# Deferred: each needs a behavior change, so it is tracked instead of fixed here.
extend-ignore = [
    "E501",  # long string literals/comments the formatter cannot wrap; shortening texts is out of scope
    "B904",  # TODO(pendencias Q4/B904): chain exceptions (`raise ... from exc`) in routes/services
    "UP042",  # TODO(pendencias Q4/UP042): str+Enum -> StrEnum changes str() output; review first
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations in default arguments are the framework idiom.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body",
    "fastapi.Header", "fastapi.File", "fastapi.Form", "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# The test encryption key must be in os.environ before the app modules are imported
"tests/conftest.py" = ["E402"]
# TODO(pendencias Q4/B017): replace blind `pytest.raises(Exception)` with the specific error
"tests/test_schemas.py" = ["B017"]
# Re-exports so Alembic/metadata see every model
"app/db/models/__init__.py" = ["F401"]
# Fake data / load-test generators: non-cryptographic randomness is intended
"app/scripts/seed.py" = ["S311", "E501", "E402"]
"locustfile.py" = ["S311"]
